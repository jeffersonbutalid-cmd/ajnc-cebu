# Netlify configuration — AJNC Cebu website
# Static site at the repo root + serverless functions for the AI assistant.

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# The knowledge base is embedded in the function (netlify/functions/_knowledge.mjs),
# so no extra bundling config is needed — this works with drag-and-drop deploys.
[functions]
  node_bundler = "esbuild"

# Friendly alias: /api/chat -> the Netlify Function
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
