<!doctype html>
<html lang="en-PH">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Page not found | Apostolic Jesus Name Church Cebu</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#FAF7F1" />
<link rel="icon" type="image/png" href="assets/ajnc-seal-mark.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--bone:#FAF7F1;--ink:#0E2B4F;--red:#C8262E;--red-deep:#971C22;--gold:#E8B53C;--slate:#5C6B7A}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bone);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 22px}
  .wrap{max-width:560px}
  .halo{width:84px;height:84px;margin:0 auto 26px;display:block}
  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--gold)}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(40px,9vw,72px);letter-spacing:-.03em;line-height:1;margin:14px 0 8px}
  h1 em{font-style:italic;color:var(--red)}
  p{font-size:17px;line-height:1.6;color:var(--ink);opacity:.82;margin:0 auto 28px;max-width:440px}
  .cta{display:inline-flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;transition:background .2s,transform .15s,border-color .2s}
  .btn:hover{transform:translateY(-1px)}
  .btn-red{background:var(--red);color:var(--bone)}
  .btn-red:hover{background:var(--red-deep)}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid rgba(14,43,79,.22)}
  .btn-ghost:hover{border-color:var(--ink)}
</style>
</head>
<body>
  <div class="wrap">
    <svg class="halo" viewBox="-50 -50 100 100" aria-hidden="true">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#E8B53C" stroke-width="1"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#B8862A" stroke-width="1.1"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#E8B53C" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="9" fill="#E8B53C"/>
    </svg>
    <span class="eyebrow">Apostolic Jesus Name Church · Cebu</span>
    <h1>Lost the <em>path?</em></h1>
    <p>We could not find that page, but you are always welcome here. Come and see,
    this Sunday at 10 AM and 3 PM in Mandaue.</p>
    <div class="cta">
      <a class="btn btn-red" href="/">Take me home <span aria-hidden="true">→</span></a>
      <a class="btn btn-ghost" href="/#plan">Plan your visit</a>
    </div>
  </div>
</body>
</html>
